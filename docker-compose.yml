# Local stack: API + PostgreSQL + LocalStack (S3). No AWS account needed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rws
      POSTGRES_PASSWORD: rws-local-only
      POSTGRES_DB: rws
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rws -d rws"]
      interval: 2s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://rws-data/datasets/demo/ | grep -q measurements"]
      interval: 3s
      retries: 30

  api:
    build: .
    environment:
      RWS_DATABASE_URL: postgresql+psycopg://rws:rws-local-only@postgres:5432/rws
      RWS_EXECUTOR: local
      RWS_AUTH_MODE: dev
      RWS_LOG_JSON: "true"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
