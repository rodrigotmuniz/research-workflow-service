[project]
name = "research-workflow-service"
version = "0.1.0"
description = "Define, run and track multi-step data automation flows for research datasets."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Muniz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "boto3>=1.34",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
rws = "rws.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "moto[s3,stepfunctions]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3,stepfunctions]>=1.34",
    "datamodel-code-generator>=0.26",
    "cfn-lint>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rws"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/rws/client/models.py", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["src/rws/client/models.py"]

[[tool.mypy.overrides]]
module = ["rws.client.models"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["moto", "moto.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["rws"]
omit = ["src/rws/client/models.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
